
  <div class="chatPanel-container">
    <div id="userProfile">
      <figure id="profile-frame">
        <img id="profile-photo" class="photo" [src]="userPhoto"  alt="user photo">
      </figure>
    </div>
    <ul class="conversation-container" id="chatConversationContainer">
      <li *ngFor="let conversation of conversations">
        <app-message-audio></app-message-audio>
      </li>
    </ul>
</div>
